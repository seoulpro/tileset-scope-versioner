name: Bug report
description: Report incorrect scope discovery, versioning, URL handling, or CLI behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include proprietary tilesets or security-sensitive path details.
        Report traversal, symbolic-link, or out-of-root access issues through
        [SECURITY.md](../../SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit you are running.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and operating system
      placeholder: "Node.js 24.x on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: Minimal asset tree and manifests
      description: >
        Show the smallest fabricated directory tree, manifest content, options,
        and asset changes that reproduce the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behavior
      description: Include the returned map, changed scopes, CLI output, or error.
    validations:
      required: true
